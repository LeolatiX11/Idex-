<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10131a" />
  <title>iDesk</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="desktop" class="desktop">
    <div class="desktop-icons">
      <button class="desktop-icon" data-app="browser">
        <span class="icon">🌐</span>
        <span>Web Apps</span>
      </button>
      <button class="desktop-icon" data-app="notes">
        <span class="icon">📝</span>
        <span>Note</span>
      </button>
      <button class="desktop-icon" data-app="calculator">
        <span class="icon">🧮</span>
        <span>Calcolatrice</span>
      </button>
    </div>

    <section id="clock-widget" class="widget draggable-widget">
      <div class="widget-handle">Ora e data</div>
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date">---</div>
    </section>

    <div id="windows"></div>
  </main>

  <nav class="taskbar">
    <button id="start-button" class="taskbar-button">iDesk</button>
    <div id="task-items" class="task-items"></div>
    <div id="task-clock" class="task-clock">--:--</div>
  </nav>

  <section id="start-menu" class="start-menu hidden">
    <h2>iDesk</h2>
    <button data-app="browser">🌐 Web Apps</button>
    <button data-app="notes">📝 Note</button>
    <button data-app="calculator">🧮 Calcolatrice</button>
  </section>

  <template id="window-template">
    <article class="window">
      <header class="window-titlebar">
        <span class="window-title">App</span>
        <div class="window-controls">
          <button class="window-minimize" aria-label="Riduci">—</button>
          <button class="window-maximize" aria-label="Massimizza">□</button>
          <button class="window-close" aria-label="Chiudi">×</button>
        </div>
      </header>
      <div class="window-content"></div>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
